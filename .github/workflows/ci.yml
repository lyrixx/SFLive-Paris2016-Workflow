name: Continuous Integration

"on":
    push:
        branches: ["master"]
    pull_request:
        branches: ["master"]
    schedule:
        - cron: "0 0 * * MON"

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: read

env:
    # Fix for symfony/color detection. We know GitHub Actions can handle it
    ANSICON: 1
    CASTOR_CONTEXT: ci

jobs:
    check-dockerfiles:
        name: Check Dockerfile
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Check php/Dockerfile
              uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
              with:
                  dockerfile: infrastructure/docker/services/php/Dockerfile

    prod-images:
        name: Test production images
        runs-on: ubuntu-latest
        env:
            CASTOR_CONTEXT: prod
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to registry
              shell: bash
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            - name: setup-castor
              uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: "Build and start the production images"
              run: "castor start"

            - name: "Test HTTP server"
              run: |
                  set -e
                  set -o pipefail

                  curl --fail --silent http://127.0.0.1:8000 | grep "symfony/workflow"
                  curl --fail --silent -o /dev/null http://127.0.0.1:8000/tasks
                  test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/index.php)" = 404

            - name: "Test the php image runs as a non-root user"
              run: "castor builder -- id -u | grep -x 1000"

    ci:
        name: Continuous Integration
        runs-on: ubuntu-latest
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to registry
              shell: bash
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            - name: setup-castor
              uses: castor-php/setup-castor@2a495b8c91f00be6768ad8a040ba8634c797d386 # v1.1.0

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: "Build and start the infrastructure"
              run: "castor start"

            - name: "Check Security issues"
              run: "castor qa:security-audit"

            - name: "Check PHP coding standards"
              run: "castor qa:cs --dry-run"

            - name: "Check Twig coding standards"
              run: "castor qa:twig-cs --dry-run"

            - name: "Run PHPStan"
              run: "castor qa:phpstan"

            - name: "Run PHPUnit"
              run: "castor qa:phpunit"
